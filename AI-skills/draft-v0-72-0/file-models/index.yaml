REPO-LAYOUT.md: .draft/ contract surface, fixed-path rule, visibility, nesting
HEADER.md: DRAFT-[file_name] header block - required at top of every .draft/*.md
STATE.md: living dashboard, authored D1-D3 percentages in one state block
